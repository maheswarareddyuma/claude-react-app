name: Deploy to S3 + CloudFront

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Build and ship static files. Infra is Terraform, applied by a human — not here.
permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: CI=true npm test
      # No source maps: the bundle is served from a public CDN, and a .map file is
      # the original source. It is also ~80% of the upload.
      - run: npm run build
        env:
          GENERATE_SOURCEMAP: "false"

      - uses: aws-actions/configure-aws-credentials@v4
        if: github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        if: github.ref == 'refs/heads/main'
        run: |
          # CRA content-hashes only what lands under build/static/. Everything else
          # (index.html, favicon.ico, robots.txt, manifest.json, the logos) keeps a
          # fixed name, so marking it immutable pins a stale copy in every browser
          # that ever fetched it for a year — and a CloudFront invalidation cannot
          # reach a browser cache. Split on the directory, not on a filename list,
          # so this stays correct as files come and go.
          aws s3 sync build/static "s3://${{ vars.SITE_BUCKET }}/static" --delete \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync build "s3://${{ vars.SITE_BUCKET }}" --delete \
            --exclude "static/*" --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"

name: Deploy to S3 + CloudFront

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Build and ship static files. Infra is Terraform, applied by a human — not here.
permissions:
  id-token: write # AWS OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: CI=true npm test
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        if: github.ref == 'refs/heads/main'
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        if: github.ref == 'refs/heads/main'
        run: |
          # Hashed assets are immutable; index.html must never be cached.
          aws s3 sync build "s3://${{ vars.SITE_BUCKET }}" --delete \
            --cache-control "public,max-age=31536000,immutable" --exclude "index.html"
          aws s3 cp build/index.html "s3://${{ vars.SITE_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        if: github.ref == 'refs/heads/main'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
